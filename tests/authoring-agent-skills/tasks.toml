#
# The map of the authoring-agent-skills tests: see tests/AGENTS.md.
#

["test:authoring-agent-skills"]
description = "Test the authoring-agent-skills skill's scripts"
depends     = [ "test:authoring-agent-skills:*" ]

["test:authoring-agent-skills:check-skill"]
description = "Test check-skill.mjs: each finding, what it leaves alone, exit codes, and this repository's skills"
tags        = [
    "test",
    "covers:skills/authoring-agent-skills/scripts/check-skill.mjs",
    "covers:skills",
]
run         = "bun test ./tests/authoring-agent-skills/check-skill.test.mts"

["test:authoring-agent-skills:extract-user-turns"]
description = "Test extract-user-turns.mjs over made-up Claude Code and Codex transcripts"
tags        = [
    "test",
    "covers:skills/authoring-agent-skills/scripts/extract-user-turns.mjs",
]
run         = "bun test ./tests/authoring-agent-skills/extract-user-turns.test.mts"

["test:authoring-agent-skills:run-eval"]
description = "Test run-eval.mjs with stand-in clients: what it records of a run, and the arguments it refuses"
tags        = [
    "test",
    "covers:skills/authoring-agent-skills/scripts/run-eval.mjs",
    "covers:skills/authoring-agent-skills/scripts/check-skill.mjs",
    "covers:skills/authoring-agent-skills/scripts/vendor/yaml.mjs",
]
run         = "bun test ./tests/authoring-agent-skills/run-eval.test.mts"

["test:authoring-agent-skills:run-eval-jail"]
description = "Test run-eval.mjs's jail and probe with stand-in clients: what a run can see and change, what the probe refuses"
tags        = [
    "test",
    "covers:skills/authoring-agent-skills/scripts/run-eval.mjs",
    "covers:skills/authoring-agent-skills/scripts/check-skill.mjs",
    "covers:skills/authoring-agent-skills/scripts/vendor/yaml.mjs",
]
run         = "bun test ./tests/authoring-agent-skills/run-eval-jail.test.mts"

["test:authoring-agent-skills:blind-grades"]
description = "Test blind-grades.mjs: blinding leaves nothing naming the arm; unblinding puts grades back and totals them"
tags        = [
    "test",
    "covers:skills/authoring-agent-skills/scripts/blind-grades.mjs",
]
run         = "bun test ./tests/authoring-agent-skills/blind-grades.test.mts"
