#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/agentic-library.git
# ::: :/tests/tasks.toml
#
#

#
# The map of the tests, a task per test file: see tests/AGENTS.md.
#

["test:configuring-mise-tasks"]
description = "Test the configuring-mise-tasks skill's bundled examples"
tags        = [ "test", "covers:skills/configuring-mise-tasks/assets" ]
run         = "bun test ./tests/configuring-mise-tasks.test.mts"

["test:mapping-tests"]
description = "Test the mapping-tests skill's bundled files, and its agreement with configuring-mise-tasks"
tags        = [
    "test",
    "covers:tests/test-tasks.test.mts",
    "covers:skills/mapping-tests",
    "covers:skills/configuring-mise-tasks/SKILL.md",
]
run         = "bun test ./tests/mapping-tests.test.mts"

["test:mise-tasks"]
description = "Test that this repository's mise tasks hand their work to hk through the shared templates, as the skill teaches"
tags        = [
    "test",
    "covers:.config/mise/config.toml",
    "covers:.config/mise/conf.d",
    "covers:.config/mise/tasks",
    "covers:.config/hk.pkl",
    "covers:skills/configuring-mise-tasks/SKILL.md",
]
run         = "bun test ./tests/mise-tasks.test.mts"

["test:skills"]
description = "Test that every skill stands alone once copied out of this repository"
tags        = [ "test", "covers:skills" ]
run         = "bun test ./tests/skills.test.mts"

["test:test-tasks"]
description = "Test that the test tasks map every test file and what it covers"
tags        = [
    "test",
    "covers:.config/mise/config.toml",
    "covers:tests/tasks.toml",
    "covers:tests/coordinating-agents/tasks.toml",
    "covers:tests/publishing-skills-to-npm/tasks.toml",
]
run         = "bun test ./tests/test-tasks.test.mts"
