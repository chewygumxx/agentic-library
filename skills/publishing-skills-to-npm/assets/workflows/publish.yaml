# ~chewygumxx/agentic-library.git
# ::: :/skills/publishing-skills-to-npm/assets/workflows/publish.yaml
#
#

#
# Copied to .github/workflows/publish.yaml, its own path above changed to
# match. Replace each <...>. Its file name is the one each package's
# trusted publisher names, so keep it.
#
# Publishes one skill's package per published GitHub release tagged
# skill-<skill>@<version>, if that is its manifest's name and version. A
# bare tag publishes nothing, so every version on npm has a release. A
# private package is refused; a release of anything else is skipped.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. Its
# command must be one the trusted publisher allows: npm publish here, or
# npm stage publish to hold each version for approval on npmjs.com.
#

name: Publish

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: startsWith(github.event.release.tag_name, 'skill-')
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # npm 11.5.1 or later must be on PATH; early Node 24 ships older.
            - name: Setup Toolchain
              uses: <setup action, such as actions/setup-node@v7 or jdx/mise-action@v4>

            - name: Install
              run: <locked install, such as bun install --frozen-lockfile or npm ci>

            - name: Resolve Package
              id: package
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  name="${TAG%@*}"
                  version="${TAG##*@}"
                  dir="skills/${name#skill-}"
                  test -f "$dir/package.json" || { echo "::error::No package at $dir"; exit 1; }
                  read -r actual_name actual_version private < <(jq -r '[.name, .version, (.private // false)] | @tsv' "$dir/package.json")
                  test "$actual_name" = "@<scope>/$name" || { echo "::error::$dir is $actual_name, tag says @<scope>/$name"; exit 1; }
                  test "$actual_version" = "$version" || { echo "::error::$dir is $actual_version, tag says $version"; exit 1; }
                  test "$private" = false || { echo "::error::$dir is private"; exit 1; }
                  echo "dir=$dir" >> "$GITHUB_OUTPUT"

            # npm itself: it alone does the OIDC exchange and signs the
            # provenance. The package's prepack copies in the licence.
            - name: Publish
              env:
                  DIR: ${{ steps.package.outputs.dir }}
              run: npm publish --workspace "$DIR"
