#

#
# Copied to .github/workflows/release-please.yaml, its own path above
# changed to match. Replace each <...>.
#
# On every push to main, release-please keeps one pull request open that
# bumps each skill with a feat or fix since its last release. Once it
# merges, the next run publishes a GitHub release per bumped skill, tagged
# skill-<skill>@<version>, which starts publish.yaml.
#
# Both jobs act as a GitHub App: what GITHUB_TOKEN creates starts no other
# workflow, so neither publish.yaml nor CI on the release pull request
# would run. The lockfiles job resyncs what records the versions, as
# release-please bumps package.json alone.
#

name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

permissions:
    contents: read

# One run at a time, so two never rewrite the release branch at once.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest

        outputs:
            prs_created: ${{ steps.release.outputs.prs_created }}
            pr: ${{ steps.release.outputs.pr }}

        steps:
            - name: Mint App Token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Release Please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ steps.app.outputs.token }}
                  config-file: .config/release-please.json
                  manifest-file: .config/release-please-manifest.json

    lockfiles:
        needs: release-please
        if: needs.release-please.outputs.prs_created == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Mint App Token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # Kept credentials push the commit below as the App.
            - name: Checkout Release Branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  token: ${{ steps.app.outputs.token }}

            - name: Setup Toolchain
              uses: <setup action, such as actions/setup-node@v7 or jdx/mise-action@v4>

            # An install that may rewrite the lockfiles; a prepare running
            # skills experimental_sync rewrites skills-lock.json.
            - name: Install
              run: <install, such as bun install or npm install>

            - name: Commit Lockfiles
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  SLUG: ${{ steps.app.outputs.app-slug }}
                  BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
              run: |
                  git add <lockfiles, such as bun.lock skills-lock.json>
                  if git diff --cached --quiet; then
                      echo "Lockfiles already match the release"
                      exit 0
                  fi
                  id=$(gh api "/users/${SLUG}[bot]" --jq .id)
                  git config user.name "${SLUG}[bot]"
                  git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
                  git commit -m "build: Resync lockfiles to the release"
                  git push origin "HEAD:${BRANCH}"
