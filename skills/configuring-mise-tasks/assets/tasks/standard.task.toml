# changed to match. Replace each <...>.
#

[install]
description = "Install the locked dependency tree"
alias       = "i"
run         = "<locked install, such as bun ci>"

[test]
description = "Run the tests"
alias       = "t"
run         = "<test command>"

[check]
description = "Run everything CI runs: lint and test"
alias       = "c"
usage       = '''
flag "--staged" negate="--all" default=#true {
    help "Lint staged files alone, or every file with --all; test in full"
}
'''
depends     = [ "lint {% if not usage.staged %}--all{% endif %}", "test" ]
