#
# Copied to .config/mise/tasks/format.task.toml, its own path above
# changed to match. Replace each <...>, and repeat format:<kind> once per
# kind of file.
#

[format]
description = "Apply every formatter"
alias       = "f"
usage       = '''
flag "--staged" negate="--all" default=#true {
    help "Format staged files alone, or every file with --all"
}
'''
depends     = [ "format:<kind> {% if not usage.staged %}--all{% endif %}" ]

["format:<kind>"]
description = "Format <kind> files with <formatter>"
usage       = '''
flag "--staged" negate="--all" default=#true {
    help "Format staged files alone, or every file with --all"
}
'''
run         = "scripts/with-files.sh {% if usage.staged %}--staged{% endif %} '*.<ext>' -- <formatter, writing>"
