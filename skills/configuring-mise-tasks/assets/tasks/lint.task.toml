#
#
# ~chewygumxx/agentic-library.git
# ::: :/skills/configuring-mise-tasks/assets/tasks/lint.task.toml
#
#

#
# Copied to .config/mise/tasks/lint.task.toml, its own path above
# changed to match. Replace each <...>, and repeat lint:<kind> once per
# kind of file.
#

[lint]
description = "Run every linter and format check"
alias       = "l"
usage       = '''
flag "--staged" negate="--all" default=#true {
    help "Lint staged files alone, or every file with --all"
}
'''
depends     = [
    "lint:<kind> {% if not usage.staged %}--all{% endif %}",
    "lint:types",
]

# --------------------
# Lint: file by file
# --------------------

["lint:<kind>"]
description = "Lint <kind> files with <linter>"
usage       = '''
flag "--staged" negate="--all" default=#true {
    help "Lint staged files alone, or every file with --all"
}
'''
sources     = [
    "**/*.<ext>",
    "!node_modules/**",
    "<linter config>",
    "<lockfile>",
    ".config/mise/config.toml",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}"
]
outputs     = { auto = true }
run         = "scripts/with-files.sh {% if usage.staged %}--staged{% endif %} '*.<ext>' -- <linter, check only>"

# ---------------------
# Lint: whole project
# ---------------------

["lint:types"]
description = "Type-check with <type checker>"
run         = "<type checker>"

["lint:commit"]
description = "Lint a commit message file with <commit linter>"
usage       = 'arg "<file>" help="The commit message file"'
run         = '<commit linter> "$usage_file"'
