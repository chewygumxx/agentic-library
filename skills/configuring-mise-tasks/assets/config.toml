#

#
# Merged into .config/mise/config.toml: the task files' include, and the
# install order the hooks need. The templates come from
# @chewygumxx/mise-tasks-config, linked into .config/mise/conf.d/.
#

[hooks]
postinstall = 'test -n "${CI-}" || { bun ci && hk install --mise; }'

[task_config]
includes = [ ".config/mise/tasks/*.task.toml" ]
