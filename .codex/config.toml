# ------------
# MCP Servers
# ------------

# skill-builder calls these tools. The first start installs the lazy tool,
# which outlasts Codex's default ten seconds.
[mcp_servers.skill-seekers]
command             = "mise"
args                = [ "run", "mcp:skill-seekers" ]
startup_timeout_sec = 120
