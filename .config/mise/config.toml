# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/agentic-library.git
# ::: :/.config/mise/config.toml
#
#

#
# Sourced during CI by GitHub Action `jdx/mise-action`
# https://mise.jdx.dev/configuration.html
#

# ----------
# Intrinsic
# ----------

min_version = "2026.9.0"

# ------
# Tools
# ------

[tools]
# Javascript/TypeScript Runtime
bun = "1.4"

# Publication to NPM Registry.
node = "24"

# Git Hooks
"aqua:jdx/hk" = "2.13.0"

# -----------------------
# Tools: Lint and Format
# -----------------------

# editorconfig
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# TOML
"aqua:tombi-toml/tombi" = "1.11.3"

# Shell
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

# YAML
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

# GitHub Actions
"aqua:rhysd/actionlint" = "1.7.12"

# ------
# Hooks
# ------

# Installs hk's git hooks, from .config/hk.pkl, on every `mise install`. They
# live in the repository's shared git config, so every worktree has them.
[hooks]
postinstall = "hk install --mise"

# ------
# Tasks
# ------

[task_config]
includes = [
    ".config/mise/tasks.toml",
    ".config/mise/*.task.toml",
    "tests/tasks.toml",
    "tests/*/tasks.toml"
]
