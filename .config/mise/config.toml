# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/agentic-library.git
# ::: :/.config/mise/config.toml
#
#

#
# Sourced during CI by GitHub Action `jdx/mise-action`
# https://mise.jdx.dev/configuration.html
#

# ----------
# Intrinsic
# ----------

min_version = "2026.9.0"

# ------
# Tools
# ------

[tool_alias]
sh = "aqua:mvdan/sh"
uv = "aqua:astral-sh/uv"
hk = "aqua:jdx/hk"
gh = "aqua:cli/cli"
jq = "aqua:jqlang/jq"

[tools]
# Runtime
bun  = "1.4"
node = "24"
sh   = "3.14.1"
uv   = "0.12.19"

# Utility
gh = "2.104.0"
jq = "1.8.2"
hk = "2.13.0"

# Secrets
"aqua:getsops/sops"    = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"

# Lint and Format
[tools."aqua:editorconfig-checker/editorconfig-checker"]
version   = "4.0.2"
lazy      = true
lazy_bins = [ "editorconfig-checker" ]

[tools."aqua:koalaman/shellcheck"]
version   = "0.11.0"
lazy      = true
lazy_bins = [ "shellcheck" ]

[tools."aqua:tombi-toml/tombi"]
version   = "1.11.3"
lazy      = true
lazy_bins = [ "tombi" ]

[tools."aqua:rhysd/actionlint"]
version   = "1.7.12"
lazy      = true
lazy_bins = [ "actionlint" ]

[tools."pypi:yamllint"]
version   = "1.38.0"
depends   = [ "uv" ]
lazy      = true
lazy_bins = [ "yamllint" ]

# Agentic
[tools."pypi:skill-seekers"]
version   = "3.10.0"
extras    = [ "mcp" ]
depends   = [ "uv" ]
lazy      = true
lazy_bins = [ "skill-seekers" ]

[wrappers]
python = { command = "uv", args = [ "run", "python" ] }

# ------------
# Environment
# ------------

[env]
# A change to these, the configuration packages' pins among them, makes
# lint and format select every file.
CGXX_WIDEN_ON = "bun.lock .config .biome.json .editorconfig .markdownlint-cli2.jsonc .secretlintrc.json"

# ------
# Hooks
# ------

[hooks]
# The hooks import the shared hk steps, which bun ci installs first. CI
# installs the packages itself, from a lockfile a release may yet refresh.
postinstall = 'test -n "${CI-}" || { bun ci && hk install --mise; }'

# ------
# Tasks
# ------

# The cgxx: templates come from @chewygumxx/mise-tasks-config, linked into
# .config/mise/conf.d/. The tests' tasks live beside the tests.
[task_config]
includes = [
    ".config/mise/tasks/*.task.toml",
    "tests/tasks.toml",
    "tests/*/tasks.toml"
]

[settings]
# Remote file tasks, such as act-cached, are experimental.
experimental = true
