# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/agentic-library.git
# ::: :/.config/mise/tasks.toml
#
#

#
# https://mise.jdx.dev/tasks/task-configuration.html
#
# File-based tasks, and lint, format and check, act on staged files alone
# unless given --all, which parents pass on. Each extends a template in
# .config/mise/config.toml, which declares the flag; a task setting its own
# sources keeps git's index among them, as the template's do.
#

# ---------
# Standard
# ---------

[install]
description = "Install the locked dependency tree"
alias       = "i"
run         = "bun ci"

[lint]
description = "Run every linter and format check"
alias       = "l"
extends     = "staged"
depends     = [
    "lint:actions      {% if not usage.staged %}--all{% endif %}",
    "lint:biome        {% if not usage.staged %}--all{% endif %}",
    "lint:editorconfig {% if not usage.staged %}--all{% endif %}",
    "lint:emdash       {% if not usage.staged %}--all{% endif %}",
    "lint:md           {% if not usage.staged %}--all{% endif %}",
    "lint:secrets      {% if not usage.staged %}--all{% endif %}",
    "lint:sh           {% if not usage.staged %}--all{% endif %}",
    "lint:spell        {% if not usage.staged %}--all{% endif %}",
    "lint:toml         {% if not usage.staged %}--all{% endif %}",
    "lint:yaml         {% if not usage.staged %}--all{% endif %}",
    "lint:deps",
    "lint:package",
    "lint:types",
]

[format]
description = "Apply every formatter"
alias       = "f"
extends     = "staged"
depends     = [
    "format:biome {% if not usage.staged %}--all{% endif %}",
    "format:sh    {% if not usage.staged %}--all{% endif %}",
    "format:toml  {% if not usage.staged %}--all{% endif %}",
    "format:yaml  {% if not usage.staged %}--all{% endif %}",
]

[test]
description = "Run the tests"
alias       = "t"
run         = "bun test"

[check]
description = "Run everything CI runs: lint and test"
alias       = "c"
extends     = "staged"
depends     = [ "lint {% if not usage.staged %}--all{% endif %}", "test" ]

# --------------------
# Lint: file by file
# --------------------

["lint:actions"]
description = "Lint GitHub workflows with actionlint"
extends     = "staged:cached"
sources     = [
    "bun.lock",
    ".config/mise/config.toml",
    ".github/workflows/*",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}"
]
# with-files.sh starts each path ./, which the shared configuration's
# paths glob does not match, so its ignores for create-github-app-token's
# client-id are repeated here. Drop both once its glob is
# **/.github/workflows/**/*.{yml,yaml}, which matches either.
run         = """
scripts/with-files.sh '.github/workflows/*.yaml' '.github/workflows/*.yml' -- actionlint -config-file node_modules/@chewygumxx/actionlint-config/config.yaml \
    -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@' \
    -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@'
"""

["lint:biome"]
description = "Lint and check formatting with Biome"
extends     = "staged:cached"
run         = "scripts/with-files.sh -- bunx --bun --no-install biome ci --no-errors-on-unmatched --files-ignore-unknown=true"

["lint:editorconfig"]
description = "Check files against .editorconfig"
extends     = "staged:cached"
run         = "scripts/with-files.sh -- editorconfig-checker -config node_modules/@chewygumxx/editorconfig-checker-config/config.json"

["lint:emdash"]
description = "Refuse em dashes"
extends     = "staged:cached"
run         = "scripts/lint-emdash.sh"

["lint:md"]
description = "Lint Markdown with remark and markdownlint"
extends     = "staged:cached"
sources     = [
    "bun.lock",
    ".config/mise/config.toml",
    "**/*.md",
    "!node_modules/**",
    ".config/remarkrc.json",
    ".markdownlint-cli2.jsonc",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}"
]
run         = [
    "scripts/with-files.sh '*.md' -- bunx --bun --no-install remark --rc-path .config/remarkrc.json --frail --quiet --no-stdout",
    "scripts/with-files.sh '*.md' -- bunx --bun --no-install markdownlint-cli2",
]

["lint:secrets"]
description = "Scan for secrets with secretlint"
extends     = "staged:cached"
run         = "scripts/with-files.sh -- bunx --bun --no-install secretlint"

["lint:sh"]
description = "Lint shell scripts with shfmt and ShellCheck"
extends     = "staged:cached"
run         = [
    "scripts/with-files.sh -- shfmt -f | tr '\\n' '\\0' | xargs -0 -r shfmt -d",
    "scripts/with-files.sh -- shfmt -f | tr '\\n' '\\0' | xargs -0 -r shellcheck --rcfile node_modules/@chewygumxx/shellcheck-config/config.shellcheckrc",
]

["lint:spell"]
description = "Check spelling with cspell"
extends     = "staged:cached"
run         = "scripts/with-files.sh -- bunx --bun --no-install cspell --no-progress --no-summary --no-must-find-files"

["lint:toml"]
description = "Lint and check formatting of TOML with Tombi"
extends     = "staged:cached"
sources     = [
    "bun.lock",
    ".config/mise/config.toml",
    "**/*.toml",
    "!node_modules/**",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}"
]
run         = [
    "scripts/with-files.sh '*.toml' -- tombi format --check",
    "scripts/with-files.sh '*.toml' -- tombi lint --error-on-warnings",
]

["lint:yaml"]
description = "Lint and check formatting of YAML with Prettier and yamllint"
extends     = "staged:cached"
sources     = [
    "bun.lock",
    ".config/mise/config.toml",
    "**/*.yaml",
    "**/*.yml",
    "!node_modules/**",
    ".config/prettierrc.json",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}"
]
env         = {
    YAMLLINT_CONFIG_FILE = "node_modules/@chewygumxx/yamllint-config/config.yaml"
}
run         = [
    "scripts/with-files.sh '*.yaml' '*.yml' -- bunx --bun --no-install prettier --config .config/prettierrc.json --check",
    "scripts/with-files.sh '*.yaml' '*.yml' -- yamllint --strict",
]

# ---------------------
# Lint: whole project
# ---------------------

["lint:deps"]
description = "Find unused files and dependencies with knip"
run         = "bunx --bun --no-install knip"

# publint packs each skill as npm would, so it reads the skill's files too.
["lint:package"]
description = "Check every package.json is sorted, and lint each skill's package with publint"
sources     = [
    "bun.lock",
    ".config/mise/config.toml",
    "package.json",
    "skills/**/*",
    "!skills/*/LICENSE",
]
outputs     = { auto = true }
run         = [
    "bunx --bun --no-install sort-package-json --check package.json skills/*/package.json",
    'for dir in skills/*/; do bunx --bun --no-install publint --level warning "$dir" || exit 1; done',
]

["lint:types"]
description = "Type-check with tsc"
run         = "bunx --bun --no-install tsc"

["lint:commit"]
description = "Lint a commit message file with commitlint"
usage       = 'arg "<file>" help="The commit message file"'
run         = 'bunx --bun --no-install commitlint --edit "$usage_file"'

["lint:headers"]
description = "Verify files' repository and path header lines"
run         = "bunx --bun --no-install sync-header-metadata"

# -------
# Format
# -------

["format:biome"]
description = "Format with Biome"
extends     = "staged"
run         = "scripts/with-files.sh -- bunx --bun --no-install biome format --write --no-errors-on-unmatched --files-ignore-unknown=true"

["format:sh"]
description = "Format shell scripts with shfmt"
extends     = "staged"
run         = "scripts/with-files.sh -- shfmt -f | tr '\\n' '\\0' | xargs -0 -r shfmt -w"

["format:toml"]
description = "Format TOML with Tombi"
extends     = "staged"
run         = "scripts/with-files.sh '*.toml' -- tombi format"

["format:yaml"]
description = "Format YAML with Prettier"
extends     = "staged"
run         = "scripts/with-files.sh '*.yaml' '*.yml' -- bunx --bun --no-install prettier --config .config/prettierrc.json --write --log-level warn"

# ------
# Other
# ------

[commit]
description = "Compose a commit with commitizen"
run         = "bunx --bun --no-install cz"

[skills]
description = "Sync the skills package.json declares, this repository's own included"
run         = "bun run skills"

# skill-builder calls these tools. The package has no script for its
# server, so run the module with the Python of the venv mise installed it in.
# The tool is lazy, so install it first; stdout carries the protocol alone.
["mcp:skill-seekers"]
description = "Serve the Skill Seekers MCP tools over stdio"
raw         = true
quiet       = true
run         = [
    "mise install --quiet pypi:skill-seekers >&2",
    'exec "$(mise where pypi:skill-seekers)/skill-seekers/bin/python" -m skill_seekers.mcp.server_fastmcp',
]

# Wrapper to refresh remote task data upon every execution.
# https://github.com/chewygumxx/.github#readme
[act]
description = "Locally execute GitHub Actions (CI) with Docker"
run         = "mise run --no-cache act-cached"
alias       = [
    "exec-ci",
    "exec-gh-act",
    "exec-gh-actions",
]

[act-cached]
description = "[Internal] Locally execute GitHub Actions (CI) with Docker"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"
hide        = true
