#
#
# ~chewygumxx/agentic-library.git
# ::: :/.github/workflows/publish.yaml
#
#

# Publishes one skill's package per published GitHub release, whose tag
# is `skill-<skill>@<version>`: `skill-mapping-tests@0.0.2` publishes
# `skills/mapping-tests` if its version matches. release-please.yaml
# publishes those releases once its pull request is merged, and that merge
# is the maintainer's approval; a bare tag publishes nothing, so every
# version on npm has an immutable release. A private package is refused,
# and a release whose tag does not start skill- is skipped.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. Each
# package must first be published once by hand, with --provenance=false as
# provenance needs CI, then have this repository and workflow added under
# its npm Settings > Trusted Publisher with the npm publish permission.
# npm allows one such publisher per package, so only this workflow can.

name: Publish

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# Releases of anything but a skill are not this workflow's.
jobs:
    check:
        if: startsWith(github.event.release.tag_name, 'skill-')
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1

    publish:
        needs: check
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Bun and Node
              uses: jdx/mise-action@v4

            - name: Resolve Package
              id: package
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  name="${TAG%@*}"
                  version="${TAG##*@}"
                  dir="skills/${name#skill-}"
                  test -f "$dir/package.json" || { echo "::error::No package at $dir"; exit 1; }
                  read -r actual_name actual_version private < <(jq -r '[.name, .version, (.private // false)] | @tsv' "$dir/package.json")
                  test "$actual_name" = "@chewygumxx/$name" || { echo "::error::$dir is $actual_name, tag says @chewygumxx/$name"; exit 1; }
                  test "$actual_version" = "$version" || { echo "::error::$dir is $actual_version, tag says $version"; exit 1; }
                  test "$private" = false || { echo "::error::$dir is private"; exit 1; }
                  echo "dir=$dir" >> "$GITHUB_OUTPUT"

            # npm, from mise's Node: Bun cannot publish by trusted
            # publishing. The package's prepack copies in the licence; the
            # check job installed and linted, so this job, holding the OIDC
            # token, runs no dependency's code.
            - name: Publish
              env:
                  DIR: ${{ steps.package.outputs.dir }}
              run: npm publish --workspace "$DIR"
